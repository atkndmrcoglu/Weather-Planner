name: advanced_weather_trip_planning_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_bloc: ^8.1.5  
  bloc: ^8.1.4         
  weather: ^3.2.1
  equatable: ^2.0.5
  geolocator: ^14.0.2
  shared_preferences: ^2.2.3
  flutter_map: ^6.1.0  
  latlong2: ^0.9.0
  timezone: ^0.9.2
  lat_lng_to_timezone: ^0.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0  
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"